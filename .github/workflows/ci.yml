name: ShipLens CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shiplens_user
          POSTGRES_PASSWORD: shiplens_secret
          POSTGRES_DB: shiplens_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Test Suite with Coverage
        env:
          DATABASE_URL: postgresql://shiplens_user:shiplens_secret@localhost:5432/shiplens_db
          NODE_ENV: test
        run: npm run test:coverage

      - name: Build Docker Image
        run: docker build -t shiplens-app:latest .