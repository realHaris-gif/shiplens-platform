services:
  postgres:
    image: postgres:16-alpine
    container_name: shiplens_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shiplens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided in .env}
      POSTGRES_DB: ${POSTGRES_DB:-shiplens_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiplens_user} -d ${POSTGRES_DB:-shiplens_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shiplens_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_SSL: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-shiplens_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shiplens_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata: